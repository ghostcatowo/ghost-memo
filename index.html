<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 유령 메모 👻</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* 라이트 모드 */
        :root {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #222222;
            --border-color: #dddddd;
            --btn-bg: #222222;
            --btn-text: #ffffff;
            --btn-hover: #444444;
            --subtitle-color: #666666;
            --copy-success-bg: #888888;
            --copy-success-text: #ffffff;
        }

        /* 다크 모드 */
        body.dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;
            --border-color: #444444;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: #cccccc;
            --subtitle-color: #888888;
            --copy-success-bg: #555555;
            --copy-success-text: #ffffff;
        }

        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 80px 20px 40px; box-sizing: border-box; margin: 0; transition: background-color 0.4s, color 0.4s; position: relative; }

        /* 상단 버튼 */
        .top-btns { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; z-index: 100; }
        .theme-toggle-btn, .clear-cache-btn { background: transparent; color: var(--text-color); border: none; font-size: 24px; cursor: pointer; transition: transform 0.3s; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; }
        .theme-toggle-btn:hover, .clear-cache-btn:hover { transform: scale(1.1); }

        /* 컨테이너 */
        .container { background: var(--container-bg); padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 400px; max-width: 100%; text-align: center; border: 1px solid var(--border-color); transition: background-color 0.4s, border-color 0.4s, box-shadow 0.4s; }
        body.dark-mode .container { box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

        h2 { color: var(--text-color); margin-bottom: 25px; font-weight: bold; letter-spacing: 2px; }
        .subtitle { color: var(--subtitle-color); font-size: 13px; margin-bottom: 25px; }

        /* 포스트잇 */
        .post-it-wrapper { position: relative; background: linear-gradient(-45deg, transparent 20px, #e9e9e9 0); box-shadow: 3px 4px 10px rgba(0,0,0,0.15); margin: 10px 0; border-radius: 2px; text-align: left; }
        .post-it-wrapper::after { content: ''; position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; background: linear-gradient(135deg, transparent 50%, #cccccc 50%); box-shadow: -2px -2px 5px rgba(0,0,0,0.1); border-bottom-left-radius: 2px; }
        .post-it-input { width: 100%; height: 160px; background: transparent; border: none; resize: none; padding: 18px; box-sizing: border-box; color: #222222; font-family: inherit; font-size: 14px; }
        .post-it-input:focus { outline: none; }
        .post-it-input::placeholder { color: #888888; font-weight: bold; }
        .post-it-view { min-height: 120px; white-space: pre-wrap; line-height: 1.6; padding: 18px 25px 25px 18px; box-sizing: border-box; color: #222222; font-size: 14px; }

        /* 입력 필드 */
        input, select { width: 100%; padding: 12px; margin: 10px 0; background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: 0.3s; }
        input::placeholder { color: var(--subtitle-color); }
        input:focus, select:focus { outline: none; border-color: var(--text-color); }
        select option { background-color: var(--container-bg); color: var(--text-color); }

        /* 버튼 */
        button.action-btn { background-color: var(--btn-bg); color: var(--btn-text); border: none; padding: 14px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; transition: 0.3s; }
        button.action-btn:hover { background-color: var(--btn-hover); }
        button.copy-btn { margin-top: 10px; background-color: var(--border-color); color: var(--text-color); }
        button.copy-btn:hover { background-color: #cccccc; color: #000; }
        button.copy-btn.success { background-color: var(--copy-success-bg); color: var(--copy-success-text); }
        .memo-action-row { display: flex; gap: 10px; margin-top: 15px; }
        .memo-action-row button { margin-top: 0; }

        .hidden { display: none; }

        /* 링크 박스 */
        #linkBox { background: transparent; color: var(--text-color); padding: 15px; border-radius: 6px; word-break: break-all; font-size: 12px; border: 1px solid var(--border-color); margin-top: 20px; max-height: 70px; overflow-y: auto; text-align: left;}
        #linkBox::-webkit-scrollbar { width: 6px; }
        #linkBox::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 10px; }

        /* 힌트 */
        #hint-display { font-size: 14px; color: var(--text-color); background: var(--border-color); padding: 10px; border-radius: 6px; margin-bottom: 10px; font-weight: bold; }

        /* 유령 둥실 */
        @keyframes wavy-floating {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            25% { transform: translate(-3px, -10px) rotate(-3deg); }
            50% { transform: translate(0px, -18px) rotate(0deg); }
            75% { transform: translate(3px, -10px) rotate(3deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }

        /* 유령 소멸 */
        @keyframes vanish-loop {
            0% { opacity: 1; filter: blur(0px); transform: scale(1); }
            50% { opacity: 0.1; filter: blur(8px); transform: scale(1.1); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1); }
        }

        .ghost-icon { font-size: 45px; margin-bottom: 5px; display: inline-block; animation: wavy-floating 3.5s ease-in-out infinite; }
        .ghost-vanish { animation: vanish-loop 4s ease-in-out infinite; }

        /* 타이틀 번짐 */
        @keyframes ghost-blur {
            0%   { filter: blur(0px);   opacity: 1;   text-shadow: 0 0 0px rgba(100,100,100,0); }
            30%  { filter: blur(3px);   opacity: 0.6; text-shadow: 0 0 12px rgba(120,120,120,0.6); }
            55%  { filter: blur(1.5px); opacity: 0.8; text-shadow: 0 0 6px rgba(120,120,120,0.3); }
            75%  { filter: blur(4px);   opacity: 0.5; text-shadow: 0 0 18px rgba(100,100,100,0.7); }
            100% { filter: blur(0px);   opacity: 1;   text-shadow: 0 0 0px rgba(100,100,100,0); }
        }
        .ghost-title { animation: ghost-blur 6s ease-in-out infinite; display: inline-block; }
        .ghost-title-wrap { display: flex; align-items: center; gap: 12px; justify-content: center; }
        .ghost-title-wrap::before, .ghost-title-wrap::after { content: ''; flex: 1; height: 1px; background: var(--text-color); opacity: 0.25; }

        /* 유령 소환 버튼 연기 효과 */
        @keyframes smoke-pulse {
            0%   { box-shadow: 0 0 8px 2px rgba(160,160,160,0.15), 0 0 20px 6px rgba(130,130,130,0.08); opacity: 0.85; }
            30%  { box-shadow: 0 0 14px 5px rgba(180,180,180,0.3), 0 0 30px 12px rgba(150,150,150,0.15); opacity: 1; }
            60%  { box-shadow: 0 0 10px 3px rgba(200,200,200,0.2), 0 0 24px 8px rgba(160,160,160,0.1); opacity: 0.9; }
            80%  { box-shadow: 0 0 18px 7px rgba(170,170,170,0.35), 0 0 36px 14px rgba(140,140,140,0.18); opacity: 1; }
            100% { box-shadow: 0 0 8px 2px rgba(160,160,160,0.15), 0 0 20px 6px rgba(130,130,130,0.08); opacity: 0.85; }
        }
        button.fire-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid rgba(180,180,180,0.4);
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            animation: smoke-pulse 3s ease-in-out infinite;
            transition: background-color 0.3s;
        }
        button.fire-btn:hover { background-color: var(--btn-hover); }
    </style>
</head>
<body>

<div class="top-btns">
    <button class="clear-cache-btn" onclick="clearSavedPasswords()">🗑️</button>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
</div>

<!-- 작성 화면 -->
<div class="container" id="create-mode">
    <div class="ghost-icon">👻</div>
    <h2 class="ghost-title-wrap"><span class="ghost-title">유령 메모</span></h2>

    <div class="post-it-wrapper">
        <textarea id="memoText" class="post-it-input" placeholder="🔒 비밀 유령 입니다"></textarea>
    </div>

    <input type="password" id="memoPassword" placeholder="암호 설정 (필수)">
    <input type="text" id="memoHint" placeholder="암호 힌트 (선택)">

    <select id="expiryTime">
        <option value="1m">1분 후 소멸 (테스트용)</option>
        <option value="1">1시간 후 소멸</option>
        <option value="3">3시간 후 소멸</option>
        <option value="5">5시간 후 소멸</option>
        <option value="24">1일 후 소멸</option>
        <option value="forever" selected>영원히 떠도는 유령</option>
    </select>

    <button class="action-btn" id="generateBtn" onclick="generateLink()">링크 생성</button>

    <div id="linkContainer" class="hidden">
        <div id="linkBox"></div>
        <button class="action-btn copy-btn" id="copyBtn" onclick="copyToClipboard()">링크 복사 📋</button>
    </div>
</div>

<!-- 열람 화면 -->
<div class="container hidden" id="view-mode">
    <div class="ghost-icon" id="view-ghost">👻</div>
    <h2 id="view-title">유령이 나타났습니다.</h2>

    <!-- 만료/오류 시 -->
    <div id="expired-section" class="hidden">
        <button class="fire-btn" onclick="goToCreate()">유령 소환 🕯</button>
    </div>

    <!-- 암호 입력 -->
    <div id="password-section">
        <div id="hint-display" class="hidden"></div>
        <input type="password" id="readPassword" placeholder="암호 입력">
        <button class="action-btn" onclick="unlockMemo()">유령 만나기</button>
    </div>

    <!-- 메모 내용 -->
    <div id="content-section" class="hidden">
        <div class="post-it-wrapper">
            <div class="post-it-view" id="decryptedText"></div>
        </div>
        <div class="memo-action-row">
            <button class="action-btn copy-btn" id="memoCopyBtn" onclick="copyMemoText()">유령 복사 📋</button>
            <button class="action-btn" onclick="goToCreate()">유령 소환 🕯</button>
        </div>
    </div>
</div>

<script>
    // 테마 토글
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
        localStorage.setItem('ghost_memo_theme', isDark ? 'dark' : 'light');
    }

    // 저장된 암호 전체 삭제
    function clearSavedPasswords() {
        localStorage.removeItem('ghost_saved_passwords');
        alert("저장 암호 삭제 완료 💀");
    }

    // 유효한 메모 해시인지 확인
    function isValidMemoHash(hash) {
        if (!hash) return false;
        try {
            const decoded = JSON.parse(decodeURIComponent(atob(hash)));
            return decoded && typeof decoded.content !== 'undefined';
        } catch {
            return false;
        }
    }

    // 만료 여부 확인
    function isExpired(hash) {
        try {
            const dataObj = JSON.parse(decodeURIComponent(atob(hash)));
            if (dataObj.exp === "forever") return false;
            return new Date().getTime() > dataObj.exp;
        } catch {
            return false;
        }
    }

    // 열람 화면 표시
    function showViewMode() {
        const hash = window.location.hash.substring(1);

        if (!hash) return;

        if (!isValidMemoHash(hash)) {
            document.getElementById('create-mode').classList.add('hidden');
            document.getElementById('view-mode').classList.remove('hidden');
            document.getElementById('view-title').innerText = "유령이 사라졌습니다.";
            document.getElementById('password-section').classList.add('hidden');
            document.getElementById('content-section').classList.add('hidden');
            document.getElementById('expired-section').classList.remove('hidden');
            document.getElementById('view-ghost').classList.add('ghost-vanish');
            return;
        }

        document.getElementById('create-mode').classList.add('hidden');
        document.getElementById('view-mode').classList.remove('hidden');

        if (isExpired(hash)) {
            document.getElementById('view-title').innerText = "유령이 사라졌습니다.";
            document.getElementById('password-section').classList.add('hidden');
            document.getElementById('content-section').classList.add('hidden');
            document.getElementById('expired-section').classList.remove('hidden');
            document.getElementById('view-ghost').classList.add('ghost-vanish');
            return;
        }

        document.getElementById('view-title').innerText = "유령이 나타났습니다.";
        document.getElementById('password-section').classList.remove('hidden');
        document.getElementById('content-section').classList.add('hidden');
        document.getElementById('expired-section').classList.add('hidden');
        document.getElementById('view-ghost').classList.remove('ghost-vanish');

        checkAutoPass();
    }

    // 초기 로드
    window.onload = function() {
        const savedTheme = localStorage.getItem('ghost_memo_theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeBtn').innerText = '☀️';
        } else {
            document.body.classList.remove('dark-mode');
            document.getElementById('themeBtn').innerText = '🌙';
        }

        if (window.location.hash.substring(1)) {
            showViewMode();
        }
    };

    // 같은 탭에서 hash 변경 감지
    window.addEventListener('hashchange', function() {
        const hash = window.location.hash.substring(1);
        if (hash) {
            document.getElementById('readPassword').value = '';
            document.getElementById('hint-display').classList.add('hidden');
            document.getElementById('content-section').classList.add('hidden');
            document.getElementById('expired-section').classList.add('hidden');
            document.getElementById('password-section').classList.remove('hidden');
            document.getElementById('view-ghost').classList.remove('ghost-vanish');
            showViewMode();
        } else {
            document.getElementById('create-mode').classList.remove('hidden');
            document.getElementById('view-mode').classList.add('hidden');
        }
    });

    // 링크 생성
    function generateLink() {
        const text = document.getElementById('memoText').value;
        const password = document.getElementById('memoPassword').value;
        const hint = document.getElementById('memoHint').value;
        const expiry = document.getElementById('expiryTime').value;

        if (!text || !password) {
            alert("메모 & 암호 확인 요망 💀");
            return;
        }

        const now = new Date().getTime();
        let expiryTimestamp = "forever";

        if (expiry === "1m") {
            expiryTimestamp = now + (1 * 60 * 1000);
        } else if (expiry !== "forever") {
            expiryTimestamp = now + (parseInt(expiry) * 60 * 60 * 1000);
        }

        const encryptedText = CryptoJS.AES.encrypt(text, password).toString();

        const dataPayload = {
            content: encryptedText,
            exp: expiryTimestamp,
            hint: hint
        };

        const base64Data = btoa(encodeURIComponent(JSON.stringify(dataPayload)));
        const shareLink = window.location.origin + window.location.pathname + "#" + base64Data;

        document.getElementById('generateBtn').innerText = "링크 생성 완료 💀";
        document.getElementById('linkContainer').classList.remove('hidden');
        document.getElementById('linkBox').innerText = shareLink;
        document.getElementById('copyBtn').classList.remove('success');
    }

    // 링크 복사
    function copyToClipboard() {
        const linkText = document.getElementById('linkBox').innerText;
        navigator.clipboard.writeText(linkText).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.classList.add('success');
            setTimeout(() => { copyBtn.classList.remove('success'); }, 600);
        }).catch(() => {
            alert("링크 복사 실패 💀");
        });
    }

    // 메모 복사
    function copyMemoText() {
        const memoText = document.getElementById('decryptedText').innerText;
        navigator.clipboard.writeText(memoText).then(() => {
            const btn = document.getElementById('memoCopyBtn');
            btn.classList.add('success');
            setTimeout(() => { btn.classList.remove('success'); }, 600);
        }).catch(() => {
            alert("메모 복사 실패 💀");
        });
    }

    // 작성 화면으로 이동 + 초기화
    function goToCreate() {
        history.pushState('', document.title, window.location.pathname);
        document.getElementById('view-mode').classList.add('hidden');
        document.getElementById('create-mode').classList.remove('hidden');
        document.getElementById('memoText').value = '';
        document.getElementById('memoPassword').value = '';
        document.getElementById('memoHint').value = '';
        document.getElementById('expiryTime').value = 'forever';
        document.getElementById('generateBtn').innerText = "링크 생성";
        document.getElementById('linkContainer').classList.add('hidden');
    }

    // 저장된 암호로 자동 해독 시도
    function tryUnlockSilent(hashData, testPassword) {
        try {
            const decodedStr = decodeURIComponent(atob(hashData));
            const dataObj = JSON.parse(decodedStr);
            const bytes = CryptoJS.AES.decrypt(dataObj.content, testPassword);
            const originalText = bytes.toString(CryptoJS.enc.Utf8);
            return !!originalText;
        } catch {
            return false;
        }
    }

    // 힌트 표시 + 자동 암호 시도
    function checkAutoPass() {
        const hashData = window.location.hash.substring(1);

        try {
            const dataObj = JSON.parse(decodeURIComponent(atob(hashData)));
            if (dataObj.hint) {
                const hintDiv = document.getElementById('hint-display');
                hintDiv.innerText = "💀 힌트: " + dataObj.hint;
                hintDiv.classList.remove('hidden');
            }
        } catch(e) {}

        const savedPasswords = JSON.parse(localStorage.getItem('ghost_saved_passwords') || "[]");
        for (let savedPass of savedPasswords) {
            if (tryUnlockSilent(hashData, savedPass)) {
                document.getElementById('readPassword').value = savedPass;
                unlockMemo(true);
                break;
            }
        }
    }

    // 암호 해독
    function unlockMemo(isAuto = false) {
        const password = document.getElementById('readPassword').value;
        const hashData = window.location.hash.substring(1);
        let dataObj;

        try {
            const decodedStr = decodeURIComponent(atob(hashData));
            dataObj = JSON.parse(decodedStr);
        } catch (e) {
            if (!isAuto) alert("링크 오류 💀");
            return;
        }

        if (dataObj.exp !== "forever" && new Date().getTime() > dataObj.exp) {
            return;
        }

        try {
            const bytes = CryptoJS.AES.decrypt(dataObj.content, password);
            const originalText = bytes.toString(CryptoJS.enc.Utf8);

            if (!originalText) throw new Error("Wrong Password");

            let savedPasswords = JSON.parse(localStorage.getItem('ghost_saved_passwords') || "[]");
            if (!savedPasswords.includes(password)) {
                savedPasswords.push(password);
                if (savedPasswords.length > 5) savedPasswords.shift();
                localStorage.setItem('ghost_saved_passwords', JSON.stringify(savedPasswords));
            }

            document.getElementById('password-section').classList.add('hidden');
            document.getElementById('content-section').classList.remove('hidden');
            document.getElementById('decryptedText').innerText = originalText;

        } catch (e) {
            if (!isAuto) alert("암호 오류 💀");
        }
    }
</script>

</body>
</html>
