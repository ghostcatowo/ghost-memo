<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 유령 메모 👻</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* 라이트 모드 */
        :root {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #222222;
            --border-color: #dddddd;
            --btn-bg: #222222;
            --btn-text: #ffffff;
            --btn-hover: #444444;
            --subtitle-color: #666666;
            --copy-success-bg: #888888;
            --copy-success-text: #ffffff;
        }

        /* 다크 모드 */
        body.dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;
            --border-color: #444444;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: #cccccc;
            --subtitle-color: #888888;
            --copy-success-bg: #555555;
            --copy-success-text: #ffffff;
        }

        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 80px 20px 40px; box-sizing: border-box; margin: 0; position: relative; }

        /* 상단 버튼 */
        .top-btns { position: absolute; top: 20px; right: 20px; display: flex; gap: 2px; z-index: 100; }
        .theme-toggle-btn, .clear-cache-btn, .manage-btn { background: transparent; color: var(--text-color); border: none; font-size: 24px; cursor: pointer; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; }

        /* 컨테이너 */
        .container { background: var(--container-bg); padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 400px; max-width: 100%; text-align: center; border: 1px solid var(--border-color); }
        body.dark-mode .container { box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

        h2 { color: var(--text-color); margin-bottom: 25px; font-weight: bold; letter-spacing: 2px; }

        /* 포스트잇 */
        .post-it-wrapper { position: relative; background: linear-gradient(-45deg, transparent 20px, #f5f5f5 0); box-shadow: 3px 4px 10px rgba(0,0,0,0.15); margin: 10px 0; border-radius: 2px; text-align: left; overflow: hidden; border: 1px solid #dddddd; }
        .post-it-wrapper::after { content: ''; position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; background: linear-gradient(135deg, transparent 50%, #dddddd 50%); border-bottom-left-radius: 2px; }
        .post-it-input { width: 100%; height: 160px; background: transparent; border: none; resize: none; padding: 18px; box-sizing: border-box; color: #222222; font-family: inherit; font-size: 14px; overflow-y: auto; word-break: break-all; }
        .post-it-input:focus { outline: none; }
        .post-it-input::placeholder { color: #888888; font-weight: bold; }
        .post-it-view { min-height: 120px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; padding: 18px 25px 25px 18px; box-sizing: border-box; color: #222222; font-size: 14px; }

        /* 입력 필드 */
        input, select { width: 100%; padding: 12px; margin: 10px 0; background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        select { padding-right: 28px; }
        input:focus, select:focus { outline: none; border-color: var(--text-color); }

        /* 버튼 */
        button.action-btn { background-color: var(--btn-bg); color: var(--btn-text); border: 1px solid transparent; padding: 14px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; box-sizing: border-box; }
        button.copy-btn { margin-top: 10px; background-color: var(--border-color); color: var(--text-color); }
        button.copy-btn.success { background-color: var(--copy-success-bg); color: var(--copy-success-text); }
        button.ghost-btn { margin-top: 10px; background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color); }
        .memo-action-row { display: flex; gap: 10px; margin-top: 15px; }
        .memo-action-row button { margin-top: 0; flex: 1; }

        .hidden { display: none; }

        /* 링크 박스 */
        #linkBox { background: transparent; color: var(--text-color); padding: 15px; border-radius: 6px; word-break: break-all; font-size: 12px; border: 1px solid var(--border-color); margin-top: 20px; max-height: 70px; overflow-y: auto; text-align: left; }

        /* 힌트 */
        #hint-display { font-size: 14px; color: var(--text-color); background: var(--border-color); padding: 10px; border-radius: 6px; margin-bottom: 10px; font-weight: bold; }

        /* 로딩 */
        .loading-text { font-size: 14px; color: var(--subtitle-color); margin-top: 15px; }

        /* 유령 둥실 */
        @keyframes wavy-floating {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            25% { transform: translate(-3px, -10px) rotate(-3deg); }
            50% { transform: translate(0px, -18px) rotate(0deg); }
            75% { transform: translate(3px, -10px) rotate(3deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }

        /* 유령 소멸 */
        @keyframes vanish-loop {
            0% { opacity: 1; filter: blur(0px); transform: scale(1); }
            50% { opacity: 0.1; filter: blur(8px); transform: scale(1.1); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1); }
        }

        .ghost-icon { font-size: 45px; margin-bottom: 5px; display: inline-block; animation: wavy-floating 3.5s ease-in-out infinite; }
        .ghost-vanish { animation: vanish-loop 4s ease-in-out infinite; }

        /* 타이틀 번짐 */
        @keyframes ghost-blur {
            0%   { filter: blur(0px); opacity: 1; }
            30%  { filter: blur(3px); opacity: 0.6; }
            100% { filter: blur(0px); opacity: 1; }
        }
        .ghost-title { animation: ghost-blur 6s ease-in-out infinite; display: inline-block; }
        .ghost-title-wrap { display: flex; align-items: center; gap: 12px; justify-content: center; }
        .ghost-title-wrap::before, .ghost-title-wrap::after { content: ''; flex: 1; height: 1px; background: var(--text-color); opacity: 0.25; }

        /* 관리창 목록 */
        .memo-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .memo-item-wrap { display: flex; flex-direction: column; gap: 0; }

        .memo-item-btn {
            background-color: transparent;
            color: var(--text-color);
            border: none;
            padding: 14px 4px;
            width: 100%;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            text-align: left;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .memo-item-text {
            border-bottom: 1px dashed var(--subtitle-color);
            padding-bottom: 2px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .memo-item-body { display: none; margin-top: 8px; margin-bottom: 0; }
        .memo-item-body.open { display: block; }

        /* 관리창 포스트잇 */
        .memo-item-postit { position: relative; background: linear-gradient(-45deg, transparent 20px, #f5f5f5 0); box-shadow: 3px 4px 10px rgba(0,0,0,0.15); border-radius: 2px; text-align: left; margin-bottom: 8px; overflow: hidden; border: 1px solid #dddddd; }
        .memo-item-postit::after { content: ''; position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; background: linear-gradient(135deg, transparent 50%, #dddddd 50%); border-bottom-left-radius: 2px; }
        .memo-item-time { font-size: 11px; color: #888888; padding: 10px 16px 0 16px; }
        .memo-item-content { font-size: 13px; color: #222222; white-space: pre-wrap; word-break: break-all; line-height: 1.6; padding: 6px 30px 20px 16px; }

        /* 링크 스타일 - 다크모드 대응 */
        .memo-item-content a, .post-it-view a { color: #555555; text-decoration: underline; word-break: break-all; font-weight: normal; }
        body.dark-mode .memo-item-content a, body.dark-mode .post-it-view a { color: #aaaaaa; }

        /* 관리창 액션 버튼 */
        .memo-item-actions { display: flex; gap: 8px; margin-bottom: 0; }
        .memo-item-actions button { flex: 1; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; border: 1px solid transparent; box-sizing: border-box; }
        .btn-delete { background-color: var(--btn-bg); color: var(--btn-text); }
        .btn-cancel { background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color) !important; }

        /* 삭제 확인 */
        .delete-confirm { display: none; margin-top: 8px; text-align: center; }
        .delete-confirm.open { display: block; }
        .delete-confirm p { font-size: 13px; color: var(--subtitle-color); margin-bottom: 8px; }
        .delete-confirm-btns { display: flex; gap: 8px; }
        .delete-confirm-btns button { flex: 1; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; border: 1px solid transparent; box-sizing: border-box; }

        .empty-msg { color: var(--subtitle-color); font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="top-btns">
    <button class="manage-btn" onclick="showManage()">🐈‍⬛</button>
    <button class="clear-cache-btn" onclick="clearSavedPasswords()">🗑️</button>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
</div>

<!-- 작성 화면 -->
<div class="container hidden" id="create-mode">
    <div class="ghost-icon">👻</div>
    <h2 class="ghost-title-wrap"><span class="ghost-title">유령 메모</span></h2>
    <div class="post-it-wrapper">
        <textarea id="memoText" class="post-it-input" placeholder="🔒 비밀 유령 입니다"></textarea>
    </div>
    <input type="password" id="memoPassword" placeholder="암호 설정 (필수)">
    <input type="text" id="memoHint" placeholder="암호 힌트 (선택)">
    <select id="expiryTime">
        <option value="1">1시간 후 소멸</option>
        <option value="5">5시간 후 소멸</option>
        <option value="24">1일 후 소멸</option>
        <option value="72">3일 후 소멸</option>
        <option value="forever" selected>Ghost never dies</option>
    </select>
    <button class="action-btn" id="generateBtn" onclick="generateMemo()">링크 생성</button>
    <div id="linkContainer" class="hidden">
        <div id="linkBox"></div>
        <button class="action-btn copy-btn" id="copyBtn" onclick="copyToClipboard()">링크 복사 📋</button>
        <button class="action-btn" onclick="resetCreate()">유령 소환 🕯</button>
    </div>
</div>

<!-- 열람 화면 -->
<div class="container hidden" id="view-mode">
    <div class="ghost-icon" id="view-ghost">👻</div>
    <h2 id="view-title">유령이 나타났습니다.</h2>
    <div id="view-loading" class="loading-text">유령 데려오는 중... 👻</div>
    <div id="expired-section" class="hidden">
        <button class="action-btn" onclick="goToCreate()">유령 소환 🕯</button>
    </div>
    <div id="password-section" class="hidden">
        <div id="hint-display" class="hidden"></div>
        <input type="password" id="readPassword" placeholder="암호 입력">
        <button class="action-btn" onclick="unlockMemo()">유령 만나기</button>
    </div>
    <div id="content-section" class="hidden">
        <div class="post-it-wrapper">
            <div class="post-it-view" id="decryptedText"></div>
        </div>
        <div class="memo-action-row">
            <button class="action-btn copy-btn" id="memoCopyBtn" onclick="copyMemoText()">유령 복사 📋</button>
            <button class="action-btn" onclick="goToCreate()">유령 소환 🕯</button>
        </div>
    </div>
</div>

<!-- 관리 화면 -->
<div class="container hidden" id="manage-mode">
    <div class="ghost-icon">👻</div>
    <h2 class="ghost-title-wrap"><span class="ghost-title">유령 관리</span></h2>
    <div id="manage-loading" class="loading-text hidden">유령 데려오는 중... 👻</div>
    <div id="manage-empty" class="empty-msg hidden">소환된 유령이 없습니다. 👻</div>
    <div id="memo-list" class="memo-list"></div>
    <button class="action-btn ghost-btn" onclick="goToCreate()" style="margin-top: 10px;">돌아가기</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC0CigDd4zHuJiihvvznNFtF0Sm7hnyK28",
        authDomain: "ghost-memo-ce80f.firebaseapp.com",
        projectId: "ghost-memo-ce80f",
        storageBucket: "ghost-memo-ce80f.firebasestorage.app",
        messagingSenderId: "836350397079",
        appId: "1:836350397079:web:d4f7e6a012d1424c81b7d2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 테마 토글
    window.toggleTheme = function() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
        localStorage.setItem('ghost_memo_theme', isDark ? 'dark' : 'light');
    };

    // 저장된 암호 전체 삭제
    window.clearSavedPasswords = function() {
        localStorage.removeItem('ghost_saved_passwords');
        alert("저장 암호 삭제 완료 💀");
    };

    // 랜덤 ID 생성 (8자리)
    function generateId() {
        return Math.random().toString(36).substring(2, 10);
    }

    // URL 자동 링크 변환 (XSS 방지 포함)
    function linkify(text) {
        const div = document.createElement('div');
        div.innerText = text;
        let safeText = div.innerHTML;
        const urlPattern = /(\b(https?):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
        return safeText.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    // 링크 생성 및 Firebase 저장
    window.generateMemo = async function() {
        const text = document.getElementById('memoText').value;
        const password = document.getElementById('memoPassword').value;
        const hint = document.getElementById('memoHint').value;
        const expiry = document.getElementById('expiryTime').value;

        if (!text || !password) {
            alert("메모 암호 확인 💀");
            return;
        }

        const btn = document.getElementById('generateBtn');
        btn.innerText = "유령 소환 중... 👻";
        btn.disabled = true;

        const now = new Date().getTime();
        let expiryTimestamp = "forever";
        if (expiry !== "forever") {
            expiryTimestamp = now + (parseInt(expiry) * 60 * 60 * 1000);
        }

        const encryptedText = CryptoJS.AES.encrypt(text, password).toString();
        const memoId = generateId();

        try {
            await setDoc(doc(db, "memos", memoId), {
                content: encryptedText,
                exp: expiryTimestamp,
                hint: hint,
                createdAt: now
            });

            // 내 메모 목록 저장 (관리창용, 암호 포함)
            const myMemos = JSON.parse(localStorage.getItem('ghost_my_memos') || "[]");
            myMemos.push({ id: memoId, password: password, exp: expiryTimestamp, createdAt: now });
            if (myMemos.length > 20) myMemos.shift();
            localStorage.setItem('ghost_my_memos', JSON.stringify(myMemos));

            const shareLink = window.location.origin + window.location.pathname + "?id=" + memoId;
            btn.innerText = "링크 생성 완료 💀";
            btn.disabled = false;
            document.getElementById('linkContainer').classList.remove('hidden');
            document.getElementById('linkBox').innerText = shareLink;
            document.getElementById('copyBtn').classList.remove('success');

        } catch (e) {
            alert("링크 생성 실패 💀");
            btn.innerText = "링크 생성";
            btn.disabled = false;
        }
    };

    // 클립보드 복사 (iOS 폴백 포함)
    function copyText(text, successEl, failMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                successEl.classList.add('success');
                setTimeout(() => { successEl.classList.remove('success'); }, 600);
            }).catch(() => { fallbackCopy(text, successEl, failMsg); });
        } else {
            fallbackCopy(text, successEl, failMsg);
        }
    }

    function fallbackCopy(text, successEl, failMsg) {
        try {
            const el = document.createElement('textarea');
            el.value = text;
            el.style.position = 'fixed';
            el.style.opacity = '0';
            document.body.appendChild(el);
            el.focus();
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            successEl.classList.add('success');
            setTimeout(() => { successEl.classList.remove('success'); }, 600);
        } catch { alert(failMsg); }
    }

    // 링크 복사
    window.copyToClipboard = function() {
        copyText(document.getElementById('linkBox').innerText, document.getElementById('copyBtn'), "링크 복사 실패 💀");
    };

    // 메모 복사
    window.copyMemoText = function() {
        copyText(document.getElementById('decryptedText').innerText, document.getElementById('memoCopyBtn'), "메모 복사 실패 💀");
    };

    // 새 메모 작성 초기화
    window.resetCreate = function() {
        document.getElementById('memoText').value = '';
        document.getElementById('memoPassword').value = '';
        document.getElementById('memoHint').value = '';
        document.getElementById('expiryTime').value = 'forever';
        document.getElementById('generateBtn').innerText = "링크 생성";
        document.getElementById('generateBtn').disabled = false;
        document.getElementById('linkContainer').classList.add('hidden');
    };

    // 작성 화면으로 이동 + 폼 초기화
    window.goToCreate = function() {
        history.pushState('', document.title, window.location.pathname);
        document.getElementById('view-mode').classList.add('hidden');
        document.getElementById('manage-mode').classList.add('hidden');
        document.getElementById('create-mode').classList.remove('hidden');
        document.getElementById('memoText').value = '';
        document.getElementById('memoPassword').value = '';
        document.getElementById('memoHint').value = '';
        document.getElementById('expiryTime').value = 'forever';
        document.getElementById('generateBtn').innerText = "링크 생성";
        document.getElementById('generateBtn').disabled = false;
        document.getElementById('linkContainer').classList.add('hidden');
    };

    // 관리 화면 표시
    window.showManage = async function() {
        document.getElementById('create-mode').classList.add('hidden');
        document.getElementById('view-mode').classList.add('hidden');
        document.getElementById('manage-mode').classList.remove('hidden');

        const myMemos = JSON.parse(localStorage.getItem('ghost_my_memos') || "[]");
        const listEl = document.getElementById('memo-list');
        const emptyEl = document.getElementById('manage-empty');
        const loadingEl = document.getElementById('manage-loading');

        listEl.innerHTML = '';
        if (myMemos.length === 0) { emptyEl.classList.remove('hidden'); return; }
        emptyEl.classList.add('hidden');
        loadingEl.classList.remove('hidden');

        const now = new Date().getTime();
        let validMemos = [];

        for (let memo of myMemos) {
            if (memo.exp !== "forever" && now > memo.exp) continue;
            try {
                const docSnap = await getDoc(doc(db, "memos", memo.id));
                if (!docSnap.exists()) continue;
                const data = docSnap.data();
                let previewText = "🔒";
                try {
                    const bytes = CryptoJS.AES.decrypt(data.content, memo.password);
                    const text = bytes.toString(CryptoJS.enc.Utf8);
                    if (text) previewText = text.substring(0, 20) + (text.length > 20 ? "..." : "");
                } catch {}
                validMemos.push({ ...memo, previewText, data });
            } catch {}
        }

        loadingEl.classList.add('hidden');

        // 만료/삭제된 메모 localStorage 정리
        const validIds = validMemos.map(m => m.id);
        localStorage.setItem('ghost_my_memos', JSON.stringify(
            myMemos.filter(m => validIds.includes(m.id))
        ));

        if (validMemos.length === 0) { emptyEl.classList.remove('hidden'); return; }

        validMemos.forEach((memo, idx) => {
            const d = new Date(memo.createdAt);
            const createdText = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

            const item = document.createElement('div');
            item.className = 'memo-item-wrap';
            item.innerHTML = `
                <button class="memo-item-btn" onclick="toggleMemoItem(${idx})">
                    <span style="font-size:16px;">👻</span>
                    <span class="memo-item-text">${memo.previewText}</span>
                </button>
                <div class="memo-item-body" id="memo-body-${idx}">
                    <div class="memo-item-postit">
                        <div class="memo-item-time">${createdText}</div>
                        <div class="memo-item-content" id="memo-content-${idx}"></div>
                    </div>
                    <div class="memo-item-actions">
                        <button class="btn-delete" onclick="showDeleteConfirm(${idx})">소환 해제 💀</button>
                    </div>
                    <div class="delete-confirm" id="delete-confirm-${idx}">
                        <p>유령을 소환 해제하겠습니까?</p>
                        <div class="delete-confirm-btns">
                            <button class="btn-cancel" onclick="hideDeleteConfirm(${idx})">취소</button>
                            <button class="btn-delete" onclick="confirmDelete('${memo.id}', ${idx})">확인</button>
                        </div>
                    </div>
                </div>
            `;
            listEl.appendChild(item);

            // XSS 방지: 내용은 linkify 후 innerHTML로
            const contentEl = document.getElementById(`memo-content-${idx}`);
            try {
                const bytes = CryptoJS.AES.decrypt(memo.data.content, memo.password);
                const content = bytes.toString(CryptoJS.enc.Utf8);
                contentEl.innerHTML = content ? linkify(content) : "복호화 실패 💀";
            } catch { contentEl.innerText = "복호화 실패 💀"; }
        });
    };

    // 목록 아이템 토글
    window.toggleMemoItem = function(idx) { document.getElementById(`memo-body-${idx}`).classList.toggle('open'); };
    window.showDeleteConfirm = function(idx) { document.getElementById(`delete-confirm-${idx}`).classList.add('open'); };
    window.hideDeleteConfirm = function(idx) { document.getElementById(`delete-confirm-${idx}`).classList.remove('open'); };

    // 메모 삭제
    window.confirmDelete = async function(memoId, idx) {
        try {
            await deleteDoc(doc(db, "memos", memoId));
            let myMemos = JSON.parse(localStorage.getItem('ghost_my_memos') || "[]");
            myMemos = myMemos.filter(m => m.id !== memoId);
            localStorage.setItem('ghost_my_memos', JSON.stringify(myMemos));
            document.getElementById(`memo-body-${idx}`).closest('.memo-item-wrap').remove();
            if (document.getElementById('memo-list').children.length === 0) {
                document.getElementById('manage-empty').classList.remove('hidden');
            }
        } catch (e) { alert("소환 해제 실패 💀"); }
    };

    // 열람 화면 로드
    async function loadMemo() {
        const memoId = new URLSearchParams(window.location.search).get('id');
        if (!memoId) return;

        document.getElementById('create-mode').classList.add('hidden');
        document.getElementById('view-mode').classList.remove('hidden');

        try {
            const docSnap = await getDoc(doc(db, "memos", memoId));
            document.getElementById('view-loading').classList.add('hidden');

            if (!docSnap.exists()) {
                document.getElementById('view-title').innerText = "유령이 사라졌습니다.";
                document.getElementById('expired-section').classList.remove('hidden');
                document.getElementById('view-ghost').classList.add('ghost-vanish');
                return;
            }

            const data = docSnap.data();

            // 만료 확인
            if (data.exp !== "forever" && new Date().getTime() > data.exp) {
                document.getElementById('view-title').innerText = "유령이 사라졌습니다.";
                document.getElementById('expired-section').classList.remove('hidden');
                document.getElementById('view-ghost').classList.add('ghost-vanish');
                await deleteDoc(doc(db, "memos", memoId));
                return;
            }

            // 힌트 표시
            if (data.hint) {
                const hintDiv = document.getElementById('hint-display');
                hintDiv.innerText = "💀 힌트: " + data.hint;
                hintDiv.classList.remove('hidden');
            }

            document.getElementById('password-section').classList.remove('hidden');

            // 저장된 암호로 자동 해독 시도
            const savedPasswords = JSON.parse(localStorage.getItem('ghost_saved_passwords') || "[]");
            for (let savedPass of savedPasswords) {
                if (tryDecrypt(data.content, savedPass)) {
                    document.getElementById('readPassword').value = savedPass;
                    unlockWithData(data, savedPass, true);
                    break;
                }
            }

        } catch (e) {
            // Firebase 오류 시 안내 표시
            document.getElementById('view-loading').classList.add('hidden');
            document.getElementById('view-title').innerText = "유령이 사라졌습니다.";
            document.getElementById('expired-section').classList.remove('hidden');
            document.getElementById('view-ghost').classList.add('ghost-vanish');
        }
    }

    // 복호화 시도
    function tryDecrypt(encryptedContent, password) {
        try {
            const bytes = CryptoJS.AES.decrypt(encryptedContent, password);
            return !!bytes.toString(CryptoJS.enc.Utf8);
        } catch { return false; }
    }

    // 암호로 메모 열기
    function unlockWithData(data, password, isAuto = false) {
        try {
            const bytes = CryptoJS.AES.decrypt(data.content, password);
            const originalText = bytes.toString(CryptoJS.enc.Utf8);
            if (!originalText) throw new Error();

            // 열람 암호 캐싱 (자동입력용)
            let savedPasswords = JSON.parse(localStorage.getItem('ghost_saved_passwords') || "[]");
            if (!savedPasswords.includes(password)) {
                savedPasswords.push(password);
                if (savedPasswords.length > 5) savedPasswords.shift();
                localStorage.setItem('ghost_saved_passwords', JSON.stringify(savedPasswords));
            }

            document.getElementById('password-section').classList.add('hidden');
            document.getElementById('content-section').classList.remove('hidden');
            document.getElementById('decryptedText').innerHTML = linkify(originalText);

        } catch (e) { if (!isAuto) alert("암호 오류 💀"); }
    }

    // 유령 만나기 버튼
    window.unlockMemo = async function() {
        const password = document.getElementById('readPassword').value;
        const memoId = new URLSearchParams(window.location.search).get('id');
        try {
            const docSnap = await getDoc(doc(db, "memos", memoId));
            if (docSnap.exists()) unlockWithData(docSnap.data(), password, false);
            else alert("링크 오류 💀");
        } catch (e) { alert("링크 오류 💀"); }
    };

    // 초기 로드
    window.onload = function() {
        const savedTheme = localStorage.getItem('ghost_memo_theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeBtn').innerText = '☀️';
        }
        const memoId = new URLSearchParams(window.location.search).get('id');
        if (memoId) loadMemo();
        else document.getElementById('create-mode').classList.remove('hidden');
    };

</script>
</body>
</html>
